const card=document.getElementById('card'),status=document.getElementById('status'),btn=document.getElementById('go');let on=false,b0=null,g0=null,last=0,drag=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function tilt(x,y,gx=50,gy=50){card.style.transform=`rotateX(${x}deg) rotateY(${y}deg) scale(1.018)`;card.style.setProperty('--gx',gx+'%');card.style.setProperty('--gy',gy+'%')}
function orient(e){if(!on||e.beta==null||e.gamma==null)return;last=Date.now();if(b0==null)b0=e.beta;if(g0==null)g0=e.gamma;const db=clamp(e.beta-b0,-24,24),dg=clamp(e.gamma-g0,-30,30),x=clamp(-db*.42,-9,9),y=clamp(dg*.42,-11,11);tilt(x,y,50+y/11*34,50+x/9*34);status.textContent=`Motion active • β ${e.beta.toFixed(1)}° • γ ${e.gamma.toFixed(1)}°`}
function motion(e){if(!on||Date.now()-last<500)return;const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null)return;const y=clamp(a.x*1.3,-10,10),x=clamp(-a.y*.9,-8,8);tilt(x,y,50+y/10*32,50+x/8*32);status.textContent='Motion active • acceleration fallback'}
async function enable(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()!=='granted'){status.textContent='Motion permission denied';return}}if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{await DeviceMotionEvent.requestPermission()}catch(e){}}on=true;b0=g0=null;window.addEventListener('deviceorientationabsolute',orient,true);window.addEventListener('deviceorientation',orient,true);window.addEventListener('devicemotion',motion,true);btn.textContent='3D motion enabled';status.textContent='Waiting for sensor data…';setTimeout(()=>{if(on&&Date.now()-last>1800)status.textContent='No sensor data received • check browser Motion sensors permission'},2200)}catch(e){status.textContent='Motion unavailable: '+e.message}}
btn.onclick=()=>{if(on){on=false;btn.textContent='Enable 3D motion';status.textContent='Motion off';tilt(0,0);return}enable()};
function pointer(e){const r=card.getBoundingClientRect(),px=clamp((e.clientX-r.left)/r.width,0,1),py=clamp((e.clientY-r.top)/r.height,0,1);tilt((.5-py)*10,(px-.5)*14,px*100,py*100);status.textContent='Touch/drag preview active'}
card.onpointerdown=e=>{if(on)return;drag=true;card.setPointerCapture?.(e.pointerId);pointer(e)};card.onpointermove=e=>{if(drag&&!on)pointer(e)};card.onpointerup=card.onpointercancel=()=>{if(on)return;drag=false;tilt(0,0);status.textContent='Touch/drag preview ready'};status.textContent='Secure context: '+(window.isSecureContext?'yes':'no')+' • tap Enable';
</script></body></html>
