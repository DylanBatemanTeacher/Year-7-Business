<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>Journey 3D Motion Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#08101f;color:#f7efe8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 0%,rgba(216,147,104,.18),transparent 34rem),linear-gradient(#08101f,#0d1425)}
.wrap{width:min(92vw,410px);text-align:center}
.kicker{letter-spacing:.2em;color:#d9a277;font:700 11px/1.2 Georgia,serif;text-transform:uppercase}
h1{font:500 31px/1.15 Georgia,serif;margin:8px 0 6px}
.sub{color:#b9c1d0;font-size:13px;line-height:1.45;margin:0 0 16px}
.stage{perspective:1200px}
.card{position:relative;aspect-ratio:896/1536;transform-style:preserve-3d;will-change:transform;transition:transform .07s linear;border-radius:22px;box-shadow:0 28px 60px rgba(0,0,0,.48);overflow:hidden;background:#0a1020;border:2px solid #e29b6c}
.card:before{content:"";position:absolute;inset:8px;border:1px solid #e7aa7c;border-radius:16px;box-shadow:inset 0 0 0 3px rgba(226,155,108,.13);transform:translateZ(1px)}
.sky{position:absolute;inset:10% 11% 17%;border-radius:14px;background:
radial-gradient(circle at 72% 18%,rgba(255,238,180,.95) 0 2%,transparent 2.2%),
linear-gradient(180deg,#4b79b8 0%,#86a7bc 38%,#d8b976 65%,#50653a 100%);overflow:hidden;transform:translateZ(2px)}
.sky:before{content:"";position:absolute;left:-6%;right:-6%;bottom:20%;height:44%;background:
radial-gradient(ellipse at 20% 100%,#243b25 0 32%,transparent 33%),
radial-gradient(ellipse at 55% 100%,#38502a 0 38%,transparent 39%),
radial-gradient(ellipse at 88% 100%,#293d25 0 36%,transparent 37%)}
.sky:after{content:"";position:absolute;left:9%;right:9%;bottom:6%;height:24%;background:linear-gradient(6deg,#7d7141,#a99a59 55%,#6c6138);clip-path:polygon(0 72%,25% 50%,47% 60%,70% 33%,100% 45%,100% 100%,0 100%)}
.stars{position:absolute;inset:18px 25px auto;color:#f0b07b;letter-spacing:1.1em;font-size:18px;white-space:nowrap;transform:translateZ(3px)}
.number{position:absolute;top:19px;left:50%;transform:translateX(-50%) translateZ(4px);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#f0d1b8;color:#15141a;border:3px double #df9668;font:italic 34px Georgia,serif}
.ribbon{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateZ(4px);min-width:62%;padding:9px 20px 10px;border-radius:50% 50% 42% 42%;background:#f0d1b8;color:#17151a;border:2px solid #db9265;font:italic 26px Georgia,serif}
.corner{position:absolute;color:#efad79;font-size:27px;transform:translateZ(3px)}
.c1{left:20px;top:26px}.c2{right:20px;top:26px}.c3{left:20px;bottom:27px}.c4{right:20px;bottom:27px}
.sheen{position:absolute;inset:0;pointer-events:none;opacity:.78;mix-blend-mode:screen;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,249,226,.32),rgba(240,193,143,.13) 18%,rgba(255,255,255,0) 48%);transform:translateZ(5px)}
.panel{margin-top:15px;padding:14px;border:1px solid rgba(240,193,143,.25);border-radius:17px;background:rgba(13,20,37,.86);backdrop-filter:blur(14px)}
button{width:100%;min-height:48px;border:0;border-radius:14px;font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16191f;background:linear-gradient(#f1c89f,#da9369)}
#status{font-size:12px;color:#aeb8c9;margin-top:9px;min-height:34px;line-height:1.4}
.hint{font-size:11px;color:#778398;margin-top:9px}
</style>
</head>
<body>
<main class="wrap">
<div class="kicker">Journey prototype</div>
<h1>3D motion test</h1>
<p class="sub">Tap enable, then slowly tilt your phone left/right and forward/back.</p>
<div class="stage">
  <div class="card" id="card">
    <div class="stars">✦ ☾ ✦</div>
    <div class="number">1</div>
    <div class="sky"></div>
    <div class="corner c1">✦</div><div class="corner c2">✦</div><div class="corner c3">✦</div><div class="corner c4">✦</div>
    <div class="ribbon">Providence</div>
    <div class="sheen"></div>
  </div>
</div>
<div class="panel">
  <button id="go">Enable 3D motion</button>
  <div id="status">Checking secure context…</div>
  <div class="hint">If sensors are blocked, drag across the card to preview the effect.</div>
</div>
</main>
<script>
const card=document.getElementById('card'),status=document.getElementById('status'),btn=document.getElementById('go');
let on=false,b0=null,g0=null,last=0,drag=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function tilt(x,y,gx=50,gy=50){
  card.style.transform=`rotateX(${x}deg) rotateY(${y}deg) scale(1.018)`;
  card.style.setProperty('--gx',gx+'%');
  card.style.setProperty('--gy',gy+'%');
}
function orient(e){
  if(!on||e.beta==null||e.gamma==null)return;
  last=Date.now();
  if(b0==null)b0=e.beta;if(g0==null)g0=e.gamma;
  const db=clamp(e.beta-b0,-24,24),dg=clamp(e.gamma-g0,-30,30);
  const x=clamp(-db*.46,-10,10),y=clamp(dg*.46,-12,12);
  tilt(x,y,50+y/12*35,50+x/10*35);
  status.textContent=`Motion active • β ${e.beta.toFixed(1)}° • γ ${e.gamma.toFixed(1)}°`;
}
function motion(e){
  if(!on||Date.now()-last<500)return;
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null||a.y==null)return;
  const y=clamp(a.x*1.35,-11,11),x=clamp(-a.y*.95,-9,9);
  tilt(x,y,50+y/11*34,50+x/9*34);
  status.textContent='Motion active • acceleration fallback';
}
async function enable(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted'){status.textContent='Motion permission denied';return;}
    }
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      try{await DeviceMotionEvent.requestPermission()}catch(e){}
    }
    on=true;b0=g0=null;last=0;
    window.addEventListener('deviceorientationabsolute',orient,true);
    window.addEventListener('deviceorientation',orient,true);
    window.addEventListener('devicemotion',motion,true);
    btn.textContent='3D motion enabled';
    status.textContent='Waiting for sensor data…';
    setTimeout(()=>{if(on&&Date.now()-last>1800)status.textContent='No sensor data • check browser Motion sensors permission'},2200);
  }catch(e){status.textContent='Motion unavailable: '+e.message}
}
btn.onclick=()=>{if(on){on=false;btn.textContent='Enable 3D motion';status.textContent='Motion off';tilt(0,0);return}enable()};
function pointer(e){
  const r=card.getBoundingClientRect(),px=clamp((e.clientX-r.left)/r.width,0,1),py=clamp((e.clientY-r.top)/r.height,0,1);
  tilt((.5-py)*10,(px-.5)*14,px*100,py*100);status.textContent='Touch/drag preview active';
}
card.onpointerdown=e=>{if(on)return;drag=true;card.setPointerCapture?.(e.pointerId);pointer(e)};
card.onpointermove=e=>{if(drag&&!on)pointer(e)};
card.onpointerup=card.onpointercancel=()=>{if(on)return;drag=false;tilt(0,0);status.textContent='Touch/drag preview ready'};
status.textContent='Secure context: '+(window.isSecureContext?'yes':'no')+' • tap Enable';
</script>
</body></html>
